nodes:
  camera_01:
    label: Camera 01 - Webcam (Zone 1 Front Left)
    package: camera_perception_pkg
    executable: ethernet_image_publisher_node
    node_name: ethernet_image_publisher_node_1
    parameters:
      image: image_01
      show_image: true
      p2_log_enabled: false
    dds_profile: fastdds_image_01_participant20.xml

  camera_02:
    label: Camera 02 - Fish-eye (Zone 1 Front Left)
    package: camera_perception_pkg
    executable: ethernet_image_publisher_node
    node_name: ethernet_image_publisher_node_2
    parameters:
      image: image_02
      show_image: true
      p2_log_enabled: false
    dds_profile: fastdds_image_02_participant21.xml

  camera_03:
    label: Camera 03 - Fish-eye (Zone 2 Front Right)
    package: camera_perception_pkg
    executable: ethernet_image_publisher_node
    node_name: ethernet_image_publisher_node_3
    parameters:
      image: image_03
      show_image: true
      p2_log_enabled: false
    dds_profile: fastdds_image_03_participant22.xml

  camera_04:
    label: Camera 04 - Fish-eye (Zone 3 Rear Left)
    package: camera_perception_pkg
    executable: ethernet_image_publisher_node
    node_name: ethernet_image_publisher_node_4
    parameters:
      image: image_04
      show_image: true
      p2_log_enabled: false
    dds_profile: fastdds_image_04_participant23.xml

  camera_05:
    label: Camera 05 - Fish-eye (Zone 4 Rear Right)
    package: camera_perception_pkg
    executable: ethernet_image_publisher_node
    node_name: ethernet_image_publisher_node_5
    parameters:
      image: image_05
      show_image: true
      p2_log_enabled: false
    dds_profile: fastdds_image_05_participant24.xml

  yolo:
    label: YOLO
    package: camera_perception_pkg
    executable: yolov8_node
    node_name: yolov8_node
    dependencies: [camera_01]
    parameters:
      log_image_header: false

  yolo_visualizer:
    label: YOLO Preview Renderer
    package: debug_pkg
    executable: yolov8_visualizer_node
    node_name: yolov8_visualizer_node
    parameters:
      image_reliability: 2

  lane:
    label: Lane Extractor
    package: camera_perception_pkg
    executable: lane_info_extractor_node
    node_name: lane_info_extractor_node
    dependencies: [yolo]
    parameters:
      show_image: true
      publish_roi_image: true

  path_planner:
    label: Path Planner
    package: decision_making_pkg
    executable: path_planner_node
    node_name: path_planner_node
    dependencies: [lane]
    parameters:
      log_planning: false

  path_visualizer:
    label: Path Planner Window
    package: debug_pkg
    executable: path_visualizer_node
    node_name: path_visualizer_node
    parameters:
      sub_roi_image_topic: roi_image
      sub_spline_path_topic: path_planning_result
      show_image: true

  preview_bridge:
    label: GUI Preview Bridge
    package: autosdv_gui_preview_bridge_pkg
    executable: preview_bridge_node
    node_name: autosdv_gui_preview_bridge
    parameters:
      jpeg_quality: 85

  motion_planner:
    label: Motion Planner
    package: decision_making_pkg
    executable: motion_planner_node
    node_name: motion_planner_node
    dependencies: [path_planner]
    parameters:
      pub_topic: /control/auto_cmd
      log_commands: false

  drive:
    label: Manual Drive
    package: data_collection_pkg
    executable: drive_node
    node_name: drive_node
    dependencies: [camera_01]
    parameters:
      input_topic: /gui/manual_input
      output_topic: /control/manual_cmd
      terminal_input: false

  safety_supervisor:
    label: Safety Supervisor
    package: autosdv_gui_pkg
    executable: safety_supervisor_node
    node_name: safety_supervisor_node
    parameters:
      zcu_disconnect_timeout_sec: 1.0

  ivn_diagnostics:
    label: IVN Diagnostics
    package: ivn_diagnostics_pkg
    executable: IVN_diagnostics_node
    node_name: IVN_diagnostics_node
    parameters:
      monitor_period_sec: 1.0
      zcu_health_topic: /ivn/zcu_health
      zcu_health_timeout_sec: 2.0
      expected_zone_ids: [zone_1, zone_2, zone_3, zone_4]
    dds_profile: fastdds_whitelist.xml

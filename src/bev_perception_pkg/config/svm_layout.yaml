# svm_layout.yaml — Surround-View canvas layout.
# The composite_canvas helper resizes each BEV tile to the ROI on placement,
# so the bev_size in each bev_*.yaml does not have to match exactly — but
# matching avoids extra cv2.resize work per frame.
output_size: [800, 800]

rois:
  front: {x: 200, y: 0,   w: 400, h: 300}
  back:  {x: 200, y: 500, w: 400, h: 300}
  left:  {x: 0,   y: 200, w: 200, h: 400}
  right: {x: 600, y: 200, w: 200, h: 400}

# Reserved area roughly where the vehicle sits in the canvas.
vehicle_box: {x: 350, y: 300, w: 100, h: 200}

# Overlay order: later entries paint on top of earlier ones.
overlay_order: [front, back, left, right]

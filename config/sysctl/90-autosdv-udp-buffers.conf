# AutoSDV HPC: allow large UDP socket receive buffers for Cyclone DDS.
#
# The camera nodes republish each JPEG as a ~900 KB BGR image. Cyclone carries
# it as a few hundred UDP fragments, and with the 208 KB kernel default cap the
# receiving sockets overflowed (UDP RcvbufErrors) and whole frames were dropped:
# /image_0N ran at 24-28 Hz while /image_0N_raw arrived at 30 Hz. The Cyclone
# profiles request 8 MiB (Internal/SocketReceiveBufferSize); this raises the cap
# so the request is granted. Installed by scripts/install_communication_mode.py.
net.core.rmem_max = 16777216
